<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Date Progress Tracker</title>
  <meta name="theme-color" content="#0f0f14" id="theme-meta" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Date Progress" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='100' fill='%231a1a24'/><circle cx='256' cy='256' r='160' fill='none' stroke='%237c6af5' stroke-width='32'/></svg>" />
  <script>
    const manifest = { name:"Date Progress Tracker", short_name:"Date Progress", start_url:"./", display:"standalone", background_color:"#0f0f14", theme_color:"#0f0f14", icons:[{src:"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='100' fill='%231a1a24'/><circle cx='256' cy='256' r='160' fill='none' stroke='%237c6af5' stroke-width='32'/></svg>",sizes:"any",type:"image/svg+xml"}]};
    const mb = new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'});
    const ml = document.createElement('link'); ml.rel='manifest'; ml.href=URL.createObjectURL(mb);
    document.currentScript.after(ml);
  </script>
  <style>
    :root {
      --bg: #0f0f14; --surface: #1a1a24; --surface2: #0f0f14;
      --border: #2e2e40; --text: #e8e6f0; --muted: #6b6880;
      --accent: #7c6af5; --accent-light: rgba(124,106,245,0.12);
    }
    [data-theme="light"] {
      --bg: #f4f3fb; --surface: #ffffff; --surface2: #f0effe;
      --border: #dddaf5; --text: #1a1824; --muted: #8880a8;
      --accent: #6c5ce7; --accent-light: rgba(108,92,231,0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; background: var(--bg);
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: var(--text); transition: background 0.3s, color 0.3s;
    }
    /* ── Layout ── */
    .page { max-width: 500px; margin: 0 auto; padding: 1.5rem 1rem 6rem; }
    /* ── Top bar ── */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1.5rem;
    }
    .topbar h1 { font-size: 1.2rem; font-weight: 600; letter-spacing: -0.02em; }
    .topbar-actions { display: flex; gap: 8px; }
    .icon-btn {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1rem; color: var(--muted);
      transition: background 0.2s, color 0.2s;
    }
    .icon-btn:hover { background: var(--accent-light); color: var(--accent); }
    /* ── Language selector ── */
    .lang-select {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 0 10px; height: 36px;
      font-size: 0.8rem; color: var(--text); cursor: pointer; outline: none;
    }
    /* ── Tracker card ── */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 1.5rem;
      margin-bottom: 1rem; transition: background 0.3s;
    }
    .card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 1.25rem; }
    .color-dot {
      width: 14px; height: 14px; border-radius: 50%;
      flex-shrink: 0; cursor: pointer; border: 2px solid transparent;
      transition: transform 0.2s;
    }
    .color-dot:hover { transform: scale(1.2); }
    .tracker-label {
      flex: 1; font-size: 0.9rem; font-weight: 500;
      background: none; border: none; color: var(--text);
      outline: none; min-width: 0;
    }
    .tracker-label::placeholder { color: var(--muted); }
    .delete-btn {
      background: none; border: none; color: var(--muted);
      font-size: 1.1rem; cursor: pointer; padding: 2px 6px;
      border-radius: 6px; transition: color 0.2s, background 0.2s;
    }
    .delete-btn:hover { color: #f05252; background: rgba(240,82,82,0.1); }
    /* ── Inputs ── */
    .inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 1.25rem; }
    .field label {
      display: block; font-size: 0.7rem; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--muted); margin-bottom: 5px;
    }
    .field input[type="date"] {
      width: 100%; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px; padding: 0.55rem 0.7rem;
      font-size: 0.82rem; color: var(--text); outline: none;
      transition: border-color 0.2s; color-scheme: dark;
    }
    [data-theme="light"] .field input[type="date"] { color-scheme: light; }
    .field input[type="date"]:focus { border-color: var(--accent); }
    /* ── Ring ── */
    .ring-section { display: flex; flex-direction: column; align-items: center; margin-bottom: 1.25rem; }
    .ring-wrap { position: relative; width: 160px; height: 160px; }
    .ring-wrap svg { transform: rotate(-90deg); }
    .ring-center {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); text-align: center;
    }
    .ring-pct { font-size: 2.1rem; font-weight: 700; letter-spacing: -0.04em; line-height: 1; }
    .ring-lbl { font-size: 0.68rem; color: var(--muted); margin-top: 3px; text-transform: uppercase; letter-spacing: 0.07em; }
    .bar-wrap { margin-top: 1rem; background: var(--surface2); border-radius: 99px; height: 5px; overflow: hidden; width: 160px; }
    .bar-fill { height: 100%; border-radius: 99px; width: 0%; transition: width 0.6s cubic-bezier(0.4,0,0.2,1), background 0.4s; }
    /* ── Badge ── */
    .status-badge {
      margin-top: 1rem; display: inline-block; font-size: 0.75rem;
      padding: 4px 12px; border-radius: 99px; font-weight: 500;
      background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
    }
    .status-badge.active { background: var(--accent-light); border-color: rgba(124,106,245,0.35); color: var(--accent); }
    .status-badge.done   { background: rgba(72,199,142,0.1); border-color: rgba(72,199,142,0.3); color: #48c78e; }
    .status-badge.danger { background: rgba(240,82,82,0.1);  border-color: rgba(240,82,82,0.3);  color: #f05252; }
    /* ── Stats ── */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 1rem; }
    .stat { background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 0.65rem; text-align: center; }
    .stat-num { font-size: 1.15rem; font-weight: 700; letter-spacing: -0.03em; }
    .stat-name { font-size: 0.64rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; margin-top: 2px; }
    /* ── Week/month breakdown ── */
    .breakdown { margin-top: 0.5rem; }
    .breakdown-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 8px; }
    .months-grid { display: flex; flex-wrap: wrap; gap: 4px; }
    .month-cell {
      flex: 1; min-width: 28px; max-width: 40px; height: 28px;
      border-radius: 6px; background: var(--surface2);
      border: 1px solid var(--border); display: flex;
      align-items: center; justify-content: center;
      font-size: 0.6rem; color: var(--muted); transition: background 0.3s;
      cursor: default; position: relative;
    }
    .month-cell.filled { color: #fff; border-color: transparent; }
    .month-cell.partial { color: #fff; border-color: transparent; }
    /* ── Color picker popup ── */
    .color-popup {
      display: none; position: absolute; z-index: 100;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 10px; gap: 8px;
      flex-wrap: wrap; width: 152px; box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .color-popup.open { display: flex; }
    .cp-swatch {
      width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
      border: 2px solid transparent; transition: transform 0.15s, border-color 0.15s;
    }
    .cp-swatch:hover { transform: scale(1.15); }
    .cp-swatch.selected { border-color: var(--text); }
    /* ── Add tracker button ── */
    .add-btn {
      width: 100%; padding: 0.75rem; background: var(--surface);
      border: 1px dashed var(--border); border-radius: 16px;
      color: var(--muted); font-size: 0.85rem; cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
      margin-bottom: 1rem;
    }
    .add-btn:hover { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }
    /* ── Share / Screenshot row ── */
    .action-row { display: flex; gap: 8px; margin-top: 0.75rem; }
    .action-btn {
      flex: 1; padding: 0.5rem; background: var(--surface2);
      border: 1px solid var(--border); border-radius: 10px;
      color: var(--muted); font-size: 0.75rem; cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .action-btn:hover { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }
    /* ── Confetti canvas ── */
    #confetti-canvas {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 9999;
    }
    /* ── Install banner ── */
    #install-banner {
      display: none; position: fixed; bottom: 1.25rem; left: 50%;
      transform: translateX(-50%);
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 0.85rem 1.25rem;
      width: calc(100% - 2rem); max-width: 420px; z-index: 999;
      align-items: center; gap: 12px;
    }
    #install-banner.show { display: flex; }
    .b-icon { width: 40px; height: 40px; flex-shrink: 0; background: var(--accent-light); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
    .b-text { flex: 1; }
    .b-text strong { display: block; font-size: 0.84rem; color: var(--text); }
    .b-text span { font-size: 0.74rem; color: var(--muted); }
    .b-install { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 0.45rem 0.9rem; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
    .b-close { background: none; border: none; color: var(--muted); font-size: 1.3rem; cursor: pointer; }
    /* ── iOS hint ── */
    #ios-hint {
      display: none; position: fixed; bottom: 1.25rem; left: 50%;
      transform: translateX(-50%);
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 1rem 1.25rem;
      width: calc(100% - 2rem); max-width: 420px; z-index: 999;
      font-size: 0.82rem; color: var(--muted); line-height: 1.6; text-align: center;
    }
    #ios-hint.show { display: block; }
    #ios-hint strong { color: var(--text); }
    #ios-hint .ios-close { display: block; margin-top: 0.5rem; color: var(--accent); cursor: pointer; font-size: 0.78rem; }
    /* ── Reminder alert ── */
    .reminder-row { display: flex; align-items: center; gap: 8px; margin-top: 0.75rem; }
    .reminder-row label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; }
    .reminder-select {
      background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
      padding: 4px 8px; font-size: 0.78rem; color: var(--text); outline: none; cursor: pointer;
    }
    .reminder-badge {
      display: none; font-size: 0.72rem; padding: 3px 10px; border-radius: 99px;
      background: rgba(240,180,30,0.12); border: 1px solid rgba(240,180,30,0.3); color: #f0b41e;
    }
    .reminder-badge.show { display: inline-block; }
    @media (max-width: 380px) {
      .inputs { grid-template-columns: 1fr; }
      .stats  { grid-template-columns: repeat(3,1fr); }
    }

    .no-trackers-msg { font-size: 0.8rem; color: var(--muted); text-align: center; padding: 0.5rem 0; }

    /* ══════════════════════════════════════════════
       TOPIC TRACKER SECTION
    ══════════════════════════════════════════════ */
    .topic-section {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 1.5rem;
      margin-bottom: 1.25rem;
    }
    .topic-section-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1rem;
    }
    .topic-section-title {
      font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--muted);
    }
    .topic-add-sub-btn {
      background: var(--accent-light); border: 1px solid rgba(124,106,245,0.3);
      border-radius: 8px; padding: 4px 12px; font-size: 0.75rem;
      color: var(--accent); cursor: pointer; font-weight: 600;
      transition: background 0.2s;
    }
    .topic-add-sub-btn:hover { background: var(--accent); color: #fff; }

    /* Daily goal bar */
    .topic-daily-bar {
      display: flex; align-items: center; gap: 10px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 12px; padding: 0.6rem 0.9rem; margin-bottom: 1rem;
    }
    .topic-daily-bar span { font-size: 0.75rem; color: var(--muted); flex: 1; }
    .topic-daily-count { font-size: 1rem; font-weight: 700; color: var(--accent); }
    .topic-daily-goal-input {
      width: 42px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 7px; padding: 3px 6px; font-size: 0.8rem;
      color: var(--text); text-align: center; outline: none;
    }
    .topic-daily-goal-input:focus { border-color: var(--accent); }
    .topic-today-progress { flex: 1; height: 4px; background: var(--border); border-radius: 99px; overflow: hidden; }
    .topic-today-fill { height: 100%; border-radius: 99px; background: var(--accent); transition: width 0.4s ease; }

    /* Subject card */
    .subject-card {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 14px; margin-bottom: 0.75rem; overflow: hidden;
    }
    .subject-header {
      display: flex; align-items: center; gap: 8px;
      padding: 0.65rem 0.9rem; cursor: pointer;
      user-select: none;
    }
    .subject-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .subject-name-input {
      flex: 1; background: none; border: none; font-size: 0.88rem;
      font-weight: 600; color: var(--text); outline: none; min-width: 0;
    }
    .subject-name-input::placeholder { color: var(--muted); font-weight: 400; }
    .subject-progress-pill {
      font-size: 0.68rem; font-weight: 700; padding: 2px 9px;
      border-radius: 99px; border: 1px solid transparent;
      flex-shrink: 0;
    }
    .subject-toggle { font-size: 0.75rem; color: var(--muted); flex-shrink: 0; transition: transform 0.2s; }
    .subject-toggle.open { transform: rotate(180deg); }
    .subject-del-btn {
      background: none; border: none; color: var(--muted); font-size: 1rem;
      cursor: pointer; padding: 2px 5px; border-radius: 5px;
      transition: color 0.2s;
    }
    .subject-del-btn:hover { color: #f05252; }

    /* Topics list */
    .topics-list { padding: 0 0.9rem 0.5rem; }
    .topic-item {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 0; border-bottom: 1px solid var(--border);
    }
    .topic-item:last-child { border-bottom: none; }
    .topic-check {
      width: 18px; height: 18px; border-radius: 5px; flex-shrink: 0;
      border: 2px solid var(--border); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem; transition: background 0.2s, border-color 0.2s;
      background: var(--surface);
    }
    .topic-check.checked { border-color: transparent; }
    .topic-check.checked::after { content: '✓'; color: #fff; font-weight: 700; }
    .topic-name-input {
      flex: 1; background: none; border: none; font-size: 0.82rem;
      color: var(--text); outline: none; min-width: 0;
    }
    .topic-name-input::placeholder { color: var(--muted); }
    .topic-name-input.done { text-decoration: line-through; color: var(--muted); }
    .topic-del-btn {
      background: none; border: none; color: var(--muted); font-size: 0.85rem;
      cursor: pointer; padding: 1px 4px; border-radius: 4px;
      transition: color 0.2s; opacity: 0;
    }
    .topic-item:hover .topic-del-btn { opacity: 1; }
    .topic-del-btn:hover { color: #f05252; }

    /* Add topic row */
    .add-topic-row {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 0.9rem 0.75rem;
    }
    .add-topic-input {
      flex: 1; background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 5px 10px; font-size: 0.8rem;
      color: var(--text); outline: none;
    }
    .add-topic-input:focus { border-color: var(--accent); }
    .add-topic-btn {
      background: var(--accent-light); border: 1px solid rgba(124,106,245,0.3);
      border-radius: 8px; padding: 5px 10px; font-size: 0.8rem;
      color: var(--accent); cursor: pointer; font-weight: 600;
      transition: background 0.2s; white-space: nowrap;
    }
    .add-topic-btn:hover { background: var(--accent); color: #fff; }

    /* Reset notice */
    .topic-reset-notice {
      font-size: 0.68rem; color: var(--muted); text-align: center;
      padding-bottom: 0.25rem; letter-spacing: 0.02em;
    }

    /* Empty state */
    .topic-empty {
      font-size: 0.8rem; color: var(--muted); text-align: center;
      padding: 1rem 0 0.5rem;
    }
  </style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<!-- Install banners -->
<div id="install-banner">
  <div class="b-icon">📲</div>
  <div class="b-text"><strong>Add to Home Screen</strong><span>Install for quick offline access</span></div>
  <button class="b-install" id="install-btn">Install</button>
  <button class="b-close" id="banner-close">×</button>
</div>
<div id="ios-hint">
  Tap <strong>Share ↑</strong> in Safari, then choose <strong>"Add to Home Screen"</strong>
  <span class="ios-close" id="close-ios">Got it</span>
</div>

<div class="page">
  <!-- Top bar -->
  <div class="topbar">
    <h1 id="app-title">📅 Date Progress</h1>
    <div class="topbar-actions">
      <select class="lang-select" id="lang-select">
        <option value="en">🇬🇧 EN</option>
        <option value="hi">🇮🇳 HI</option>
        <option value="ar">🇸🇦 AR</option>
        <option value="fr">🇫🇷 FR</option>
        <option value="es">🇪🇸 ES</option>
        <option value="zh">🇨🇳 ZH</option>
        <option value="de">🇩🇪 DE</option>
      </select>
      <button class="icon-btn" id="theme-btn" title="Toggle theme">🌙</button>
    </div>
  </div>

  <!-- ══ TOPIC TRACKER ══ -->
  <div class="topic-section" id="topic-section">
    <div class="topic-section-header">
      <div class="topic-section-title">📚 Topic Tracker</div>
      <button class="topic-add-sub-btn" id="topic-add-sub-btn">＋ Add Subject</button>
    </div>

    <!-- Daily goal bar -->
    <div class="topic-daily-bar">
      <span>Daily goal</span>
      <input class="topic-daily-goal-input" id="topic-goal-input" type="number" min="1" max="30" value="3" title="Topics per day goal">
      <span style="font-size:0.72rem;color:var(--muted)">topics/day</span>
      <div class="topic-today-progress"><div class="topic-today-fill" id="topic-today-fill"></div></div>
      <span class="topic-daily-count" id="topic-today-count">0/3</span>
    </div>

    <div id="subjects-container">
      <div class="topic-empty" id="topic-empty-msg">Add a subject to start tracking topics</div>
    </div>

    <div class="topic-reset-notice" id="topic-reset-notice"></div>
  </div>

  <!-- Trackers container -->
  <div id="trackers"></div>
  <!-- Add new tracker -->
  <button class="add-btn" id="add-btn">＋ <span id="add-label">Add another tracker</span></button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
// ══════════════════════════════════════════════
//  TRANSLATIONS
// ══════════════════════════════════════════════

const COLORS = ['#7c6af5','#f05252','#48c78e','#f0a030','#3b9eff','#f06292','#26c6da','#ff7043','#ab47bc'];
const CIRC = 2 * Math.PI * 72;

let lang = localStorage.getItem('dp-lang') || 'en';
let theme = localStorage.getItem('dp-theme') || 'dark';
let trackers = JSON.parse(localStorage.getItem('dp-trackers') || 'null') || [
  { id: 1, label: '', start: '', end: '', color: '#7c6af5', reminder: 'none' }

// ══════════════════════════════════════════════
function save() {

  localStorage.setItem('dp-lang', lang);
  localStorage.setItem('dp-theme', theme);
}

// ══════════════════════════════════════════════
//  CONFETTI
// ══════════════════════════════════════════════
function launchConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const pieces = Array.from({length: 120}, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height - canvas.height,
    w: Math.random() * 10 + 5, h: Math.random() * 6 + 3,
    color: COLORS[Math.floor(Math.random() * COLORS.length)],
    rot: Math.random() * 360, rotSpd: (Math.random()-0.5)*6,
    spd: Math.random() * 3 + 2, drift: (Math.random()-0.5)*2
  }));
  let frame = 0;
  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p => {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot * Math.PI/180);
      ctx.fillStyle = p.color; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
      p.y += p.spd; p.x += p.drift; p.rot += p.rotSpd;
    });
    frame++;
    if (frame < 180) requestAnimationFrame(draw);
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  draw();
}

// ══════════════════════════════════════════════
//  MONTHS BREAKDOWN
// ══════════════════════════════════════════════
function buildBreakdown(container, start, end, now, pct, color) {
  container.innerHTML = '';
  if (!start || !end || end <= start) return;
  const total = Math.round((end - start) / 86400000);
  if (total < 7) return;

  const title = document.createElement('div');
  title.className = 'breakdown-title';
  title.textContent = t('weekBreak');
  container.appendChild(title);

  const grid = document.createElement('div');
  grid.className = 'months-grid';

  // Split into up to 12 segments
  const segments = Math.min(12, Math.ceil(total / 30));
  const segSize = total / segments;

  for (let i = 0; i < segments; i++) {
    const segStart = new Date(start.getTime() + i * segSize * 86400000);
    const segEnd   = new Date(start.getTime() + (i+1) * segSize * 86400000);
    const cell = document.createElement('div');
    cell.className = 'month-cell';

    const mn = segStart.toLocaleString(lang === 'en' ? 'en' : lang, {month:'short'});
    cell.textContent = mn;
    cell.title = segStart.toLocaleDateString() + ' – ' + segEnd.toLocaleDateString();

    if (now >= segEnd) {
      cell.classList.add('filled');
      cell.style.background = color;
    } else if (now >= segStart) {
      const segPct = (now - segStart) / (segEnd - segStart);
      cell.classList.add('partial');
      cell.style.background = `linear-gradient(90deg, ${color} ${Math.round(segPct*100)}%, var(--surface2) ${Math.round(segPct*100)}%)`;
      cell.style.color = segPct > 0.4 ? '#fff' : 'var(--muted)';
    }
    grid.appendChild(cell);
  }
  container.appendChild(grid);
}

// ══════════════════════════════════════════════
//  SHARE
// ══════════════════════════════════════════════
function shareTracker(tracker) {
  const pct = getTrackerPct(tracker);
  const text = `📅 ${tracker.label || t('title')}: ${pct}% ${t('elapsed')} — ${tracker.start} → ${tracker.end}`;
  if (navigator.share) {
    navigator.share({ title: t('title'), text });
  } else {
    navigator.clipboard.writeText(text).then(() => alert('Copied to clipboard!'));
  }
}

async function screenshotTracker(cardEl) {
  if (typeof html2canvas === 'undefined') { alert('Screenshot library not loaded.'); return; }
  const canvas = await html2canvas(cardEl, { backgroundColor: null, scale: 2 });
  const link = document.createElement('a');
  link.download = 'date-progress.png';
  link.href = canvas.toDataURL();
  link.click();
}

function getTrackerPct(tracker) {
  if (!tracker.start || !tracker.end) return 0;
  const s = new Date(tracker.start), e = new Date(tracker.end);
  if (e <= s) return 0;
  const now = new Date(); now.setHours(0,0,0,0);
  const total = Math.round((e - s) / 86400000);
  const elapsed = Math.max(0, Math.min(total, Math.round((now - s) / 86400000)));
  return Math.round((elapsed / total) * 100);
}

// ══════════════════════════════════════════════
//  REMINDER CHECK
// ══════════════════════════════════════════════
function checkReminder(tracker) {
  if (!tracker.end || tracker.reminder === 'none') return false;
  const now = new Date(); now.setHours(0,0,0,0);
  const end = new Date(tracker.end);
  const daysLeft = Math.round((end - now) / 86400000);
  const threshold = parseInt(tracker.reminder);
  return daysLeft >= 0 && daysLeft <= threshold;
}

// ══════════════════════════════════════════════
//  RENDER ONE TRACKER
// ══════════════════════════════════════════════
function renderTracker(tracker) {
  const card = document.createElement('div');
  card.className = 'card';
  card.id = 'card-' + tracker.id;

  // Header
  const hdr = document.createElement('div');
  hdr.className = 'card-header';

  // Color dot + popup
  const dotWrap = document.createElement('div');
  dotWrap.style.position = 'relative';
  const dot = document.createElement('div');
  dot.className = 'color-dot';
  dot.style.background = tracker.color;
  dot.title = 'Pick color';

  const popup = document.createElement('div');
  popup.className = 'color-popup';
  COLORS.forEach(c => {
    const sw = document.createElement('div');
    sw.className = 'cp-swatch' + (c === tracker.color ? ' selected' : '');
    sw.style.background = c;
    sw.addEventListener('click', () => {
      tracker.color = c;
      dot.style.background = c;
      popup.querySelectorAll('.cp-swatch').forEach(s => s.classList.remove('selected'));
      sw.classList.add('selected');
      popup.classList.remove('open');
      save(); updateTrackerUI(tracker);
    });
    popup.appendChild(sw);
  });
  dot.addEventListener('click', e => { e.stopPropagation(); popup.classList.toggle('open'); });
  document.addEventListener('click', () => popup.classList.remove('open'));
  dotWrap.appendChild(dot);
  dotWrap.appendChild(popup);

  // Label input
  const labelInput = document.createElement('input');
  labelInput.className = 'tracker-label';
  labelInput.type = 'text';
  labelInput.placeholder = t('label') + '…';
  labelInput.value = tracker.label;
  labelInput.addEventListener('input', () => { tracker.label = labelInput.value; save(); });

  // Delete button
  const delBtn = document.createElement('button');
  delBtn.className = 'delete-btn';
  delBtn.textContent = '×';
  delBtn.title = 'Delete';
  delBtn.addEventListener('click', () => {
    trackers = trackers.filter(t => t.id !== tracker.id);
    save(); renderAll();
  });

  hdr.appendChild(dotWrap);
  hdr.appendChild(labelInput);
  hdr.appendChild(delBtn);
  card.appendChild(hdr);

  // Date inputs
  const inputs = document.createElement('div');
  inputs.className = 'inputs';
  ['start','end'].forEach(key => {
    const f = document.createElement('div');
    f.className = 'field';
    const lbl = document.createElement('label');
    lbl.textContent = t(key);
    const inp = document.createElement('input');
    inp.type = 'date';
    inp.value = tracker[key];
    inp.addEventListener('change', () => { tracker[key] = inp.value; save(); updateTrackerUI(tracker); });
    f.appendChild(lbl); f.appendChild(inp);
    inputs.appendChild(f);
  });
  card.appendChild(inputs);

  // Ring section
  const ringSection = document.createElement('div');
  ringSection.className = 'ring-section';

  const ringWrap = document.createElement('div');
  ringWrap.className = 'ring-wrap';
  ringWrap.innerHTML = `
    <svg width="160" height="160" viewBox="0 0 160 160">
      <circle cx="80" cy="80" r="64" fill="none" stroke="var(--border)" stroke-width="13"/>
      <circle class="arc" cx="80" cy="80" r="64" fill="none" stroke="${tracker.color}"
        stroke-width="13" stroke-linecap="round"
        stroke-dasharray="${CIRC}" stroke-dashoffset="${CIRC}"
        style="transition:stroke-dashoffset 0.6s cubic-bezier(0.4,0,0.2,1),stroke 0.4s;"/>
    </svg>
    <div class="ring-center">
      <div class="ring-pct">—</div>
      <div class="ring-lbl">${t('pickDates')}</div>
    </div>`;
  ringSection.appendChild(ringWrap);

  const barWrap = document.createElement('div');
  barWrap.className = 'bar-wrap';
  const barFill = document.createElement('div');
  barFill.className = 'bar-fill';
  barFill.style.background = tracker.color;
  barWrap.appendChild(barFill);
  ringSection.appendChild(barWrap);

  const badge = document.createElement('div');
  badge.className = 'status-badge';
  badge.textContent = t('waitDates');
  ringSection.appendChild(badge);
  card.appendChild(ringSection);

  // Stats
  const stats = document.createElement('div');
  stats.className = 'stats';
  ['elapsed','remaining','total'].forEach(key => {
    const s = document.createElement('div');
    s.className = 'stat';
    s.innerHTML = `<div class="stat-num">—</div><div class="stat-name">${t(key)}</div>`;
    stats.appendChild(s);
  });
  card.appendChild(stats);

  // Breakdown
  const breakdown = document.createElement('div');
  breakdown.className = 'breakdown';

  // Reminder row
  const remRow = document.createElement('div');
  remRow.className = 'reminder-row';

  remSelect.className = 'reminder-select';
  [['none', t('remindNone')],['7',t('remindBefore7')],['14',t('remindBefore14')],['30',t('remindBefore30')]].forEach(([v,lbl]) => {
    const opt = document.createElement('option');
    opt.value = v; opt.textContent = lbl;
    if (v === tracker.reminder) opt.selected = true;
    remSelect.appendChild(opt);
  });
  remSelect.addEventListener('change', () => { tracker.reminder = remSelect.value; save(); updateTrackerUI(tracker); });
  const remBadge = document.createElement('span');
  remBadge.className = 'reminder-badge';
  remBadge.textContent = t('remindActive');
  remRow.appendChild(remLabel);
  remRow.appendChild(remSelect);

  return card;
}

// ══════════════════════════════════════════════
//  UPDATE TRACKER UI
// ══════════════════════════════════════════════
function updateTrackerUI(tracker) {
  const card = document.getElementById('card-' + tracker.id);
  if (!card) return;
  const arc      = card.querySelector('.arc');
  const pctEl    = card.querySelector('.ring-pct');
  const lblEl    = card.querySelector('.ring-lbl');
  const badge    = card.querySelector('.status-badge');
  const barFill  = card.querySelector('.bar-fill');
  const statNums = card.querySelectorAll('.stat-num');
  const breakdown= card.querySelector('.breakdown');
  const remBadge = card.querySelector('.reminder-badge');

  // Update arc color when color changes
  arc.setAttribute('stroke', tracker.color);
  barFill.style.background = tracker.color;

  if (!tracker.start || !tracker.end) {
    arc.setAttribute('stroke-dashoffset', CIRC);
    pctEl.textContent = '—'; lblEl.textContent = t('pickDates');
    badge.textContent = t('waitDates'); badge.className = 'status-badge';
    barFill.style.width = '0%';
    statNums.forEach(s => s.textContent = '—');
    breakdown.innerHTML = '';
    remBadge.classList.remove('show');
    return;
  }

  const start = new Date(tracker.start);
  const end   = new Date(tracker.end);
  const now   = new Date(); now.setHours(0,0,0,0);

  if (end <= start) {
    arc.setAttribute('stroke-dashoffset', CIRC * 0.98);
    pctEl.textContent = '!'; lblEl.textContent = t('endBeforeStart');
    badge.textContent = t('endBeforeStart'); badge.className = 'status-badge danger';
    barFill.style.width = '0%';
    statNums.forEach(s => s.textContent = '—');
    breakdown.innerHTML = '';
    remBadge.classList.remove('show');
    return;
  }

  const total   = Math.round((end - start) / 86400000);
  const elapsed = Math.max(0, Math.min(total, Math.round((now - start) / 86400000)));
  const left    = Math.max(0, total - elapsed);
  const pct     = Math.round((elapsed / total) * 100);

  arc.setAttribute('stroke-dashoffset', (CIRC - (pct/100)*CIRC).toFixed(2));
  barFill.style.width = pct + '%';
  pctEl.textContent = pct + '%';

  let badgeClass, badgeText, subText;
  if (pct === 0)       { badgeClass='done';   badgeText=t('notStarted');  subText=t('notStarted'); }
  else if (pct >= 100) { badgeClass='done';   badgeText=t('complete');    subText=t('complete');
    if (!confettiFired.has(tracker.id)) {
      launchConfetti();
      confettiFired.add(tracker.id);
      localStorage.setItem('dp-confetti', JSON.stringify([...confettiFired]));
    }
  }
  else if (pct >= 80)  { badgeClass='danger'; badgeText=pct+'% '+t('elapsed'); subText=t('almostDone'); }
  else if (pct >= 50)  { badgeClass='active'; badgeText=pct+'% '+t('elapsed'); subText=t('pastHalf'); }
  else                 { badgeClass='active'; badgeText=pct+'% '+t('elapsed'); subText=t('inProgress'); }

  badge.textContent = badgeText; badge.className = 'status-badge ' + badgeClass;
  lblEl.textContent = subText;

  statNums[0].textContent = elapsed.toLocaleString() + t('days');
  statNums[1].textContent = left.toLocaleString()    + t('days');
  statNums[2].textContent = total.toLocaleString()   + t('days');

  buildBreakdown(breakdown, start, end, now, pct, tracker.color);

  // Reminder
  if (checkReminder(tracker)) remBadge.classList.add('show');
  else remBadge.classList.remove('show');
}

// ══════════════════════════════════════════════
//  RENDER ALL
// ══════════════════════════════════════════════
function renderAll() {
  const container = document.getElementById('trackers');
  container.innerHTML = '';
  trackers.forEach(tracker => {
    const card = renderTracker(tracker);
    container.appendChild(card);
    updateTrackerUI(tracker);
  });
  document.getElementById('add-label').textContent = t('addTracker');
}

document.getElementById('add-btn').addEventListener('click', () => {
  const colorIndex = trackers.length % COLORS.length;
  trackers.push({ id: nextId++, label: '', start: '', end: '', color: COLORS[colorIndex], reminder: 'none' });
  save(); renderAll();
  document.getElementById('trackers').lastElementChild.scrollIntoView({ behavior: 'smooth' });
});

//  TOPIC TRACKER
// ══════════════════════════════════════════════
const SUB_COLORS = ['#7c6af5','#48c78e','#f05252','#f0a030','#3b9eff','#f06292','#26c6da','#ff7043','#ab47bc'];

function loadTopicData() {
  return JSON.parse(localStorage.getItem('tp-data') || 'null') || { goal: 3, subjects: [], lastReset: '' };
}
function saveTopicData(data) {
  localStorage.setItem('tp-data', JSON.stringify(data));
}

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

// Auto-reset checked topics at the start of a new day
function maybeResetDaily(data) {
  const today = todayStr();
  if (data.lastReset !== today) {
    data.subjects.forEach(sub => {
      sub.topics.forEach(tp => { tp.checked = false; });
    });
    data.lastReset = today;
    saveTopicData(data);
  }
}

function countTodayDone(data) {
  let n = 0;
  data.subjects.forEach(sub => sub.topics.forEach(tp => { if (tp.checked) n++; }));
  return n;
}

function renderTopicTracker() {
  const data = loadTopicData();
  maybeResetDaily(data);

  const container = document.getElementById('subjects-container');
  const emptyMsg  = document.getElementById('topic-empty-msg');
  const goalInput = document.getElementById('topic-goal-input');
  const fillEl    = document.getElementById('topic-today-fill');
  const countEl   = document.getElementById('topic-today-count');
  const resetNote = document.getElementById('topic-reset-notice');

  goalInput.value = data.goal;

  // Reset notice
  const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1);
  const tStr = tomorrow.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
  resetNote.textContent = '✦ Checkmarks reset automatically each day · next reset ' + tStr;

  function updateGoalBar() {
    const done = countTodayDone(data);
    const goal = data.goal;
    const pct  = Math.min(100, Math.round((done / goal) * 100));
    fillEl.style.width = pct + '%';
    fillEl.style.background = pct >= 100 ? '#48c78e' : 'var(--accent)';
    countEl.textContent = done + '/' + goal;
    countEl.style.color = pct >= 100 ? '#48c78e' : 'var(--accent)';
  }

  function rebuildSubjects() {
    // Clear only subject cards (keep emptyMsg)
    Array.from(container.children).forEach(el => {
      if (el.id !== 'topic-empty-msg') el.remove();
    });

    if (data.subjects.length === 0) {
      emptyMsg.style.display = '';
    } else {
      emptyMsg.style.display = 'none';
    }

    data.subjects.forEach((sub, si) => {
      const color = SUB_COLORS[si % SUB_COLORS.length];
      sub.color = color;

      const card = document.createElement('div');
      card.className = 'subject-card';

      // ── Subject header ──
      const hdr = document.createElement('div');
      hdr.className = 'subject-header';

      const dot = document.createElement('div');
      dot.className = 'subject-dot';
      dot.style.background = color;

      const nameInput = document.createElement('input');
      nameInput.className = 'subject-name-input';
      nameInput.type = 'text';
      nameInput.placeholder = 'Subject name…';
      nameInput.value = sub.name;
      nameInput.addEventListener('input', () => { sub.name = nameInput.value; saveTopicData(data); });
      nameInput.addEventListener('click', e => e.stopPropagation());

      const done  = sub.topics.filter(tp => tp.checked).length;
      const total = sub.topics.length;
      const pill  = document.createElement('div');
      pill.className = 'subject-progress-pill';
      pill.textContent = done + '/' + total + ' done';
      const pillPct = total > 0 ? done/total : 0;
      pill.style.background = pillPct === 1 ? 'rgba(72,199,142,0.15)' : `rgba(${hexToRgb(color)},0.12)`;
      pill.style.borderColor = pillPct === 1 ? 'rgba(72,199,142,0.4)' : `rgba(${hexToRgb(color)},0.35)`;
      pill.style.color       = pillPct === 1 ? '#48c78e' : color;

      const toggle = document.createElement('div');
      toggle.className = 'subject-toggle';
      toggle.textContent = '▼';

      const delBtn = document.createElement('button');
      delBtn.className = 'subject-del-btn';
      delBtn.textContent = '×';
      delBtn.title = 'Delete subject';
      delBtn.addEventListener('click', e => {
        e.stopPropagation();
        if (confirm('Delete "' + (sub.name || 'this subject') + '" and all its topics?')) {
          data.subjects.splice(si, 1);
          saveTopicData(data); rebuildSubjects(); updateGoalBar();
        }
      });

      hdr.appendChild(dot);
      hdr.appendChild(nameInput);
      hdr.appendChild(pill);
      hdr.appendChild(toggle);
      hdr.appendChild(delBtn);

      // ── Topics body ──
      const body = document.createElement('div');
      body.style.display = sub.open !== false ? '' : 'none';
      if (sub.open !== false) toggle.classList.add('open');

      hdr.addEventListener('click', () => {
        const isOpen = body.style.display !== 'none';
        body.style.display = isOpen ? 'none' : '';
        toggle.classList.toggle('open', !isOpen);
        sub.open = !isOpen;
        saveTopicData(data);
      });

      const list = document.createElement('div');
      list.className = 'topics-list';

      function buildTopicItem(tp, ti) {
        const row = document.createElement('div');
        row.className = 'topic-item';

        const chk = document.createElement('div');
        chk.className = 'topic-check' + (tp.checked ? ' checked' : '');
        chk.style.background = tp.checked ? color : '';
        chk.style.borderColor = tp.checked ? color : '';
        chk.addEventListener('click', () => {
          tp.checked = !tp.checked;
          chk.classList.toggle('checked', tp.checked);
          chk.style.background   = tp.checked ? color : '';
          chk.style.borderColor  = tp.checked ? color : '';
          tpInput.classList.toggle('done', tp.checked);
          saveTopicData(data);
          // refresh pill
          const newDone = sub.topics.filter(x => x.checked).length;
          const newTotal = sub.topics.length;
          pill.textContent = newDone + '/' + newTotal + ' done';
          const np = newTotal > 0 ? newDone/newTotal : 0;
          pill.style.background  = np === 1 ? 'rgba(72,199,142,0.15)' : `rgba(${hexToRgb(color)},0.12)`;
          pill.style.borderColor = np === 1 ? 'rgba(72,199,142,0.4)'  : `rgba(${hexToRgb(color)},0.35)`;
          pill.style.color       = np === 1 ? '#48c78e' : color;
          updateGoalBar();
        });

        const tpInput = document.createElement('input');
        tpInput.className = 'topic-name-input' + (tp.checked ? ' done' : '');
        tpInput.type = 'text';
        tpInput.placeholder = 'Topic name…';
        tpInput.value = tp.name;
        tpInput.addEventListener('input', () => { tp.name = tpInput.value; saveTopicData(data); });

        const tpDel = document.createElement('button');
        tpDel.className = 'topic-del-btn';
        tpDel.textContent = '×';
        tpDel.title = 'Remove topic';
        tpDel.addEventListener('click', () => {
          sub.topics.splice(ti, 1);
          saveTopicData(data); rebuildSubjects(); updateGoalBar();
        });

        row.appendChild(chk);
        row.appendChild(tpInput);
        row.appendChild(tpDel);
        return row;
      }

      sub.topics.forEach((tp, ti) => list.appendChild(buildTopicItem(tp, ti)));

      // ── Add topic row ──
      const addRow = document.createElement('div');
      addRow.className = 'add-topic-row';
      const addInput = document.createElement('input');
      addInput.className = 'add-topic-input';
      addInput.type = 'text';
      addInput.placeholder = 'New topic…';
      const addBtn = document.createElement('button');
      addBtn.className = 'add-topic-btn';
      addBtn.textContent = '+ Add';

      function doAddTopic() {
        const name = addInput.value.trim();
        if (!name) { addInput.focus(); return; }
        sub.topics.push({ name, checked: false });
        saveTopicData(data); rebuildSubjects(); updateGoalBar();
        // Re-open subject
        setTimeout(() => {
          const cards = document.querySelectorAll('.subject-card');
          const thisCard = cards[si];
          if (thisCard) {
            const b = thisCard.querySelector('.topics-list')?.parentElement;
            if (b) b.style.display = '';
          }
        }, 10);
      }
      addBtn.addEventListener('click', doAddTopic);
      addInput.addEventListener('keydown', e => { if (e.key === 'Enter') doAddTopic(); });

      addRow.appendChild(addInput);
      addRow.appendChild(addBtn);

      body.appendChild(list);
      body.appendChild(addRow);
      card.appendChild(hdr);
      card.appendChild(body);
      container.appendChild(card);
    });

    updateGoalBar();
  }

  // Goal input
  goalInput.addEventListener('change', () => {
    const v = Math.max(1, parseInt(goalInput.value) || 1);
    data.goal = v; goalInput.value = v;
    saveTopicData(data); updateGoalBar();
  });

  // Add subject button
  document.getElementById('topic-add-sub-btn').onclick = () => {
    data.subjects.push({ name: '', topics: [], open: true });
    saveTopicData(data); rebuildSubjects();
    // Focus the new subject name input
    setTimeout(() => {
      const cards = container.querySelectorAll('.subject-card');
      const last = cards[cards.length - 1];
      if (last) last.querySelector('.subject-name-input')?.focus();
    }, 30);
  };

  rebuildSubjects();
}

// Hex to R,G,B string helper for rgba()
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return r+','+g+','+b;
}

renderTopicTracker();

// ══════════════════════════════════════════════
//  SERVICE WORKER
// ══════════════════════════════════════════════
if ('serviceWorker' in navigator) {
  const swCode = `const CACHE='dp-v2';self.addEventListener('install',e=>{e.waitUntil(caches.open(CACHE).then(c=>c.addAll(['./'])));self.skipWaiting();});self.addEventListener('activate',e=>{self.clients.claim();});self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)));});`;
  const swBlob = new Blob([swCode], { type: 'text/javascript' });
  navigator.serviceWorker.register(URL.createObjectURL(swBlob));
}

// ══════════════════════════════════════════════
//  INSTALL PROMPT
// ══════════════════════════════════════════════
let deferredPrompt;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredPrompt = e;
  document.getElementById('install-banner').classList.add('show');
});
document.getElementById('install-btn').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('install-banner').classList.remove('show');
});
document.getElementById('banner-close').addEventListener('click', () => {
  document.getElementById('install-banner').classList.remove('show');
});
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
if (isIOS && !navigator.standalone) {
  setTimeout(() => document.getElementById('ios-hint').classList.add('show'), 1500);
}
document.getElementById('close-ios').addEventListener('click', () => {
  document.getElementById('ios-hint').classList.remove('show');
});

// ══════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════
applyLang();
</script>
