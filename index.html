<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Date Progress Tracker</title>
  <meta name="theme-color" content="#0f0f14" id="theme-meta" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Date Progress" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='100' fill='%231a1a24'/><circle cx='256' cy='256' r='160' fill='none' stroke='%237c6af5' stroke-width='32'/></svg>" />
  <script>
    const manifest = { name:"Date Progress Tracker", short_name:"Date Progress", start_url:"./", display:"standalone", background_color:"#0f0f14", theme_color:"#0f0f14", icons:[{src:"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='100' fill='%231a1a24'/><circle cx='256' cy='256' r='160' fill='none' stroke='%237c6af5' stroke-width='32'/></svg>",sizes:"any",type:"image/svg+xml"}]};
    const mb = new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'});
    const ml = document.createElement('link'); ml.rel='manifest'; ml.href=URL.createObjectURL(mb);
    document.currentScript.after(ml);
  </script>
  <style>
    /* ════ THEMES ════ */
    :root {
      --bg: #0f0f14; --surface: #1a1a24; --surface2: #0f0f14;
      --border: #2e2e40; --text: #e8e6f0; --muted: #6b6880;
      --accent: #7c6af5; --accent-light: rgba(124,106,245,0.12);
      --easy: #48c78e; --med: #f0a030; --hard: #f05252;
    }
    [data-theme="light"] {
      --bg: #f4f3fb; --surface: #ffffff; --surface2: #f0effe;
      --border: #dddaf5; --text: #1a1824; --muted: #8880a8;
      --accent: #6c5ce7; --accent-light: rgba(108,92,231,0.1);
    }
    [data-theme="midnight"] {
      --bg: #0b0f19; --surface: #111827; --surface2: #1f2937;
      --border: #374151; --text: #f3f4f6; --muted: #9ca3af;
      --accent: #3b82f6; --accent-light: rgba(59,130,246,0.15);
    }
    [data-theme="forest"] {
      --bg: #0f1712; --surface: #142018; --surface2: #1e3326;
      --border: #2d4b38; --text: #e8f5e9; --muted: #81c784;
      --accent: #4caf50; --accent-light: rgba(76,175,80,0.15);
    }
    [data-theme="rose"] {
      --bg: #1f1316; --surface: #2b1a1f; --surface2: #3d252c;
      --border: #5c3742; --text: #ffe4e6; --muted: #fda4af;
      --accent: #f43f5e; --accent-light: rgba(244,63,94,0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; background: var(--bg);
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: var(--text); transition: background 0.3s, color 0.3s;
    }
    /* Fixed bottom padding so the menu never covers the content */
    .page { max-width: 500px; margin: 0 auto; padding: 1.5rem 1rem 120px; }
    
    /* ── Top bar ── */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1.5rem;
    }
    .topbar h1 { font-size: 1.2rem; font-weight: 600; letter-spacing: -0.02em; }
    .topbar-actions { display: flex; gap: 8px; align-items: center; }
    .icon-btn {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1rem; color: var(--muted);
      transition: background 0.2s, color 0.2s;
    }
    .icon-btn:hover { background: var(--accent-light); color: var(--accent); }
    
    .lang-select {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 0 10px; height: 36px;
      font-size: 0.8rem; color: var(--text); cursor: pointer; outline: none;
    }

    /* ════ BOTTOM NAVIGATION BAR ════ */
    .bottom-nav {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 500px; background: var(--surface);
      border-top: 1px solid var(--border); display: flex;
      justify-content: space-around; 
      /* Added safe-area padding for modern phones */
      padding: 10px 0 calc(20px + env(safe-area-inset-bottom)); 
      z-index: 1000;
    }
    .nav-btn {
      background: none; border: none; color: var(--muted);
      font-size: 0.75rem; display: flex; flex-direction: column;
      align-items: center; gap: 4px; cursor: pointer; transition: color 0.2s;
    }
    .nav-btn.active { color: var(--accent); font-weight: 600; }
    .nav-icon { font-size: 1.2rem; }
    
    /* FIX: Hide bottom nav automatically when the keyboard opens */
    @media (max-height: 500px) {
      .bottom-nav { display: none; }
    }
    
    /* ════ TAB PANES ════ */
    .tab-pane { display: none; animation: fadeIn 0.3s ease; }
    .tab-pane.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    /* ════ COLLAPSIBLE UI ════ */
    .section-toggle { font-size: 0.75rem; color: var(--muted); flex-shrink: 0; transition: transform 0.2s; padding: 4px; }
    .section-toggle.open { transform: rotate(180deg); }
    .collapsible-body { display: none; width: 100%; margin-top: 1rem; }
    #pomo-body.open { display: flex; flex-direction: column; align-items: center; }

    /* ════ STREAK HEATMAP ════ */
    .streak-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 1.25rem; margin-bottom: 1.25rem;
    }
    .streak-header {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted);
    }
    .heatmap-scroll { overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; width: 100%; }
    .heatmap-scroll::-webkit-scrollbar { display: none; }
    .heatmap-grid { display: grid; grid-template-rows: repeat(7, 1fr); grid-auto-flow: column; gap: 4px; }
    .heatmap-cell {
      width: 12px; height: 12px; border-radius: 3px; background: var(--surface2);
      border: 1px solid var(--border); transition: background 0.3s;
    }
    .heatmap-cell.done { background: var(--easy); border-color: var(--easy); box-shadow: 0 0 5px rgba(72,199,142,0.3); }

    /* ════ TIMETABLE ════ */
    .tt-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 1.25rem; margin-bottom: 1.25rem;
    }
    .tt-header { display: flex; justify-content: space-between; align-items: center; }
    .tt-title { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
    .tt-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; width: 100%; }
    .tt-row {
      display: flex; align-items: center; gap: 8px; background: var(--surface2);
      padding: 0.5rem; border-radius: 12px; border: 1px solid var(--border);
    }
    .tt-color {
      width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0;
      cursor: pointer; border: 2px solid transparent;
    }
    .tt-time-input {
      background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
      padding: 4px; font-size: 0.75rem; color: var(--text); outline: none; color-scheme: dark;
    }
    [data-theme="light"] .tt-time-input { color-scheme: light; }
    .tt-label-input {
      flex: 1; background: none; border: none; font-size: 0.8rem;
      color: var(--text); outline: none; min-width: 0;
    }
    .tt-label-input::placeholder { color: var(--muted); }
    .tt-del-btn { background: none; border: none; color: var(--muted); font-size: 1rem; cursor: pointer; padding: 0 4px; }
    .tt-del-btn:hover { color: var(--hard); }
    .tt-add-btn {
      width: 100%; background: var(--accent-light); border: 1px dashed rgba(124,106,245,0.4);
      border-radius: 10px; padding: 0.6rem; font-size: 0.8rem; color: var(--accent);
      cursor: pointer; font-weight: 600; transition: all 0.2s;
    }
    .tt-add-btn:hover { background: var(--accent); color: #fff; border-style: solid; }

    /* ════ DAILY CHECKLIST ════ */
    .checklist-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 1.25rem; margin-bottom: 1.25rem; }
    .cl-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
    .cl-item { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); }
    .cl-item:last-child { border-bottom: none; }
    .cl-check { width: 18px; height: 18px; border-radius: 5px; flex-shrink: 0; border: 2px solid var(--border); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; background: var(--surface); transition: all 0.2s; }
    .cl-check.checked { border-color: var(--easy); background: var(--easy); }
    .cl-check.checked::after { content: '✓'; color: #fff; font-weight: 700; }
    .cl-text { flex: 1; font-size: 0.85rem; color: var(--text); outline: none; border: none; background: none; }
    .cl-text.done { text-decoration: line-through; color: var(--muted); }
    .cl-del { background: none; border: none; color: var(--muted); font-size: 0.9rem; cursor: pointer; opacity: 0.6; }
    .cl-del:hover { color: var(--hard); opacity: 1; }

    /* ════ POMODORO TIMER ════ */
    .pomo-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 1.25rem; margin-bottom: 1.25rem; display: flex; flex-direction: column; align-items: center;
    }
    .pomo-header { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    .pomo-title { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
    .pomo-settings-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1rem; }
    .pomo-settings-btn:hover { color: var(--accent); }
    .pomo-display { font-size: 3.5rem; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; color: var(--text); line-height: 1; margin-bottom: 0.5rem; }
    .pomo-status { font-size: 0.8rem; color: var(--accent); font-weight: 600; margin-bottom: 1.25rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .pomo-controls { display: flex; gap: 10px; }
    .pomo-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 0.6rem 1.5rem; font-size: 0.9rem; font-weight: 600; color: var(--text); cursor: pointer; transition: all 0.2s; }
    .pomo-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .pomo-btn.primary:hover { opacity: 0.9; transform: translateY(-1px); }
    .pomo-btn:hover { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }
    .pomo-settings { width: 100%; background: var(--surface2); border-radius: 12px; padding: 1rem; margin-top: 1rem; display: none; gap: 10px; border: 1px solid var(--border); }
    .pomo-settings.open { display: flex; }
    .pomo-input-group { flex: 1; display: flex; flex-direction: column; gap: 5px; }
    .pomo-input-group label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; }
    .pomo-input { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 0.5rem; color: var(--text); outline: none; width: 100%; text-align: center; }
    .pomo-input:focus { border-color: var(--accent); }

    /* ── Tracker card (Base) ── */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 1.5rem; margin-bottom: 1rem; transition: background 0.3s; }
    .card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 1.25rem; }
    .color-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; cursor: pointer; border: 2px solid transparent; transition: transform 0.2s; }
    .color-dot:hover { transform: scale(1.2); }
    .tracker-label { flex: 1; font-size: 0.9rem; font-weight: 500; background: none; border: none; color: var(--text); outline: none; min-width: 0; }
    .tracker-label::placeholder { color: var(--muted); }
    .delete-btn { background: none; border: none; color: var(--muted); font-size: 1.1rem; cursor: pointer; padding: 2px 6px; border-radius: 6px; transition: color 0.2s, background 0.2s; }
    .delete-btn:hover { color: #f05252; background: rgba(240,82,82,0.1); }
    .inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 1.25rem; }
    .field label { display: block; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 5px; }
    .field input[type="date"] { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 0.55rem 0.7rem; font-size: 0.82rem; color: var(--text); outline: none; transition: border-color 0.2s; color-scheme: dark; }
    [data-theme="light"] .field input[type="date"] { color-scheme: light; }
    .field input[type="date"]:focus { border-color: var(--accent); }
    
    .ring-section { display: flex; flex-direction: column; align-items: center; margin-bottom: 1.25rem; }
    .ring-wrap { position: relative; width: 160px; height: 160px; }
    .ring-wrap svg { transform: rotate(-90deg); }
    .ring-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
    .ring-pct { font-size: 2.1rem; font-weight: 700; letter-spacing: -0.04em; line-height: 1; }
    .ring-lbl { font-size: 0.68rem; color: var(--muted); margin-top: 3px; text-transform: uppercase; letter-spacing: 0.07em; }
    .bar-wrap { margin-top: 1rem; background: var(--surface2); border-radius: 99px; height: 5px; overflow: hidden; width: 160px; }
    .bar-fill { height: 100%; border-radius: 99px; width: 0%; transition: width 0.6s cubic-bezier(0.4,0,0.2,1), background 0.4s; }
    
    .status-badge { margin-top: 1rem; display: inline-block; font-size: 0.75rem; padding: 4px 12px; border-radius: 99px; font-weight: 500; background: var(--surface2); border: 1px solid var(--border); color: var(--muted); }
    .status-badge.active { background: var(--accent-light); border-color: rgba(124,106,245,0.35); color: var(--accent); }
    .status-badge.done   { background: rgba(72,199,142,0.1); border-color: rgba(72,199,142,0.3); color: #48c78e; }
    .status-badge.danger { background: rgba(240,82,82,0.1);  border-color: rgba(240,82,82,0.3);  color: #f05252; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 1rem; }
    .stat { background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 0.65rem; text-align: center; }
    .stat-num { font-size: 1.15rem; font-weight: 700; letter-spacing: -0.03em; }
    .stat-name { font-size: 0.64rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; margin-top: 2px; }
    
    .breakdown { margin-top: 0.5rem; }
    .breakdown-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 8px; }
    .months-grid { display: flex; flex-wrap: wrap; gap: 4px; }
    .month-cell { flex: 1; min-width: 28px; max-width: 40px; height: 28px; border-radius: 6px; background: var(--surface2); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 0.6rem; color: var(--muted); transition: background 0.3s; cursor: default; position: relative; }
    .month-cell.filled { color: #fff; border-color: transparent; }
    .month-cell.partial { color: #fff; border-color: transparent; }
    
    .color-popup { display: none; position: absolute; z-index: 100; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px; gap: 8px; flex-wrap: wrap; width: 152px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
    .color-popup.open { display: flex; }
    .cp-swatch { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform 0.15s, border-color 0.15s; }
    .cp-swatch:hover { transform: scale(1.15); }
    .cp-swatch.selected { border-color: var(--text); }
    
    .add-btn { width: 100%; padding: 0.75rem; background: var(--surface); border: 1px dashed var(--border); border-radius: 16px; color: var(--muted); font-size: 0.85rem; cursor: pointer; transition: background 0.2s, color 0.2s, border-color 0.2s; margin-bottom: 1rem; }
    .add-btn:hover { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }
    .action-row { display: flex; gap: 8px; margin-top: 0.75rem; }
    .action-btn { flex: 1; padding: 0.5rem; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; color: var(--muted); font-size: 0.75rem; cursor: pointer; transition: background 0.2s, color 0.2s; }
    .action-btn:hover { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }
    
    #confetti-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; }
    
    .reminder-row { display: flex; align-items: center; gap: 8px; margin-top: 0.75rem; }
    .reminder-row label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; }
    .reminder-select { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px; font-size: 0.78rem; color: var(--text); outline: none; cursor: pointer; }
    .reminder-badge { display: none; font-size: 0.72rem; padding: 3px 10px; border-radius: 99px; background: rgba(240,180,30,0.12); border: 1px solid rgba(240,180,30,0.3); color: #f0b41e; }
    .reminder-badge.show { display: inline-block; }

    /* ════ TOPIC TRACKER ════ */
    .topic-section { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 1.5rem; margin-bottom: 1.25rem; }
    .topic-section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .topic-section-title { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
    .topic-add-sub-btn { background: var(--accent-light); border: 1px solid rgba(124,106,245,0.3); border-radius: 8px; padding: 4px 12px; font-size: 0.75rem; color: var(--accent); cursor: pointer; font-weight: 600; transition: background 0.2s; }
    .topic-add-sub-btn:hover { background: var(--accent); color: #fff; }
    .topic-daily-bar { display: flex; align-items: center; gap: 10px; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 0.6rem 0.9rem; margin-bottom: 1rem; }
    .topic-daily-bar span { font-size: 0.75rem; color: var(--muted); flex: 1; }
    .topic-daily-count { font-size: 1rem; font-weight: 700; color: var(--accent); }
    .topic-daily-goal-input { width: 42px; background: var(--surface); border: 1px solid var(--border); border-radius: 7px; padding: 3px 6px; font-size: 0.8rem; color: var(--text); text-align: center; outline: none; }
    .topic-daily-goal-input:focus { border-color: var(--accent); }
    .topic-today-progress { flex: 1; height: 4px; background: var(--border); border-radius: 99px; overflow: hidden; }
    .topic-today-fill { height: 100%; border-radius: 99px; background: var(--accent); transition: width 0.4s ease; }
    
    .subject-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 0.75rem; overflow: hidden; }
    .subject-header { display: flex; align-items: center; gap: 8px; padding: 0.65rem 0.9rem; cursor: pointer; user-select: none; }
    .subject-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    
    /* Finished CSS line from the previous prompt */
    .subject-name { flex: 1; font-size: 0.85rem; font-weight: 500; color: var(--text); }
  </style>
</head>
<body>

  <div class="page">
    
    <div class="topbar">
      <h1>Date Progress</h1>
      <div class="topbar-actions">
        <button class="icon-btn" id="export-btn" title="Export Data to JSON">💾</button>
        <label class="icon-btn" title="Import Data from JSON" style="cursor: pointer;">
          📂
          <input type="file" id="import-file" style="display:none" accept=".json">
        </label>
      </div>
    </div>

    <div id="tab-home" class="tab-pane active">
      
      <div class="checklist-card">
        <h3 class="topic-section-title" style="margin-bottom: 10px;">Daily Checklist</h3>
        <div class="cl-list" id="checklist">
          </div>
        <button class="add-btn" id="add-task-btn">+ Add Task</button>
      </div>

    </div>

    <div id="tab-focus" class="tab-pane">
      <div class="pomo-card">
        <div class="pomo-header">
          <span class="pomo-title">Pomodoro Timer</span>
        </div>
        <div class="pomo-display">25:00</div>
        <div class="pomo-status">Focus Time</div>
        <div class="pomo-controls">
          <button class="pomo-btn primary">Start</button>
          <button class="pomo-btn">Reset</button>
        </div>
      </div>
    </div>

    <div class="bottom-nav">
      <button class="nav-btn active" onclick="switchTab('tab-home', this)">
        <span class="nav-icon">📋</span> Home
      </button>
      <button class="nav-btn" onclick="switchTab('tab-focus', this)">
        <span class="nav-icon">⏱️</span> Focus
      </button>
    </div>

  </div>

  <script>
    // ════ TAB SWITCHING LOGIC ════
    function switchTab(tabId, element) {
      // Hide all tabs & remove active state from buttons
      document.querySelectorAll('.tab-pane').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      
      // Show selected tab & set button active
      document.getElementById(tabId).classList.add('active');
      element.classList.add('active');
    }

    // ════ DATA PERSISTENCE (LocalStorage) ════
    
    // Load existing data or set defaults
    let appData = JSON.parse(localStorage.getItem('dateProgressData')) || {
      tasks: [
        { id: 1, text: 'Drink Water', done: false },
        { id: 2, text: 'Read for 20 mins', done: true }
      ]
    };

    function saveData() {
      // Save to local browser storage so it survives refresh
      localStorage.setItem('dateProgressData', JSON.stringify(appData));
      renderTasks();
    }

    // Render Checklist UI
    function renderTasks() {
      const list = document.getElementById('checklist');
      list.innerHTML = ''; // Clear list
      
      appData.tasks.forEach((task, index) => {
        const div = document.createElement('div');
        div.className = 'cl-item';
        div.innerHTML = `
          <div class="cl-check ${task.done ? 'checked' : ''}" onclick="toggleTask(${index})"></div>
          <input class="cl-text ${task.done ? 'done' : ''}" type="text" value="${task.text}" onchange="updateTask(${index}, this.value)">
          <button class="cl-del" onclick="deleteTask(${index})">✕</button>
        `;
        list.appendChild(div);
      });
    }

    function toggleTask(index) {
      appData.tasks[index].done = !appData.tasks[index].done;
      saveData();
    }

    function updateTask(index, newText) {
      appData.tasks[index].text = newText;
      saveData();
    }

    function deleteTask(index) {
      appData.tasks.splice(index, 1);
      saveData();
    }

    // Event listener for Add Task button
    document.getElementById('add-task-btn').addEventListener('click', () => {
      appData.tasks.push({ id: Date.now(), text: '', done: false });
      saveData();
    });

    // ════ EXPORT / IMPORT LOGIC ════

    // Export Data as JSON file
    document.getElementById('export-btn').addEventListener('click', () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
      const downloadAnchorElement = document.createElement('a');
      downloadAnchorElement.setAttribute("href", dataStr);
      downloadAnchorElement.setAttribute("download", "date-progress-backup.json");
      document.body.appendChild(downloadAnchorElement); // Required for Firefox
      downloadAnchorElement.click();
      downloadAnchorElement.remove();
    });

    // Import Data from JSON file
    document.getElementById('import-file').addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (!file) return;

      const fileReader = new FileReader();
      fileReader.onload = (e) => {
        try {
          const importedData = JSON.parse(e.target.result);
          
          // Basic validation to make sure it's our app data
          if(importedData && importedData.tasks) {
            appData = importedData;
            saveData();
            alert('Your data has been successfully imported!');
          } else {
            alert('Invalid file format. Ensure it is a backup from Date Progress Tracker.');
          }
        } catch (err) {
          alert('Error reading the file. Please upload a valid JSON backup.');
        }
      };
      fileReader.readAsText(file);
      
      // Reset input so you can import the same file twice if needed
      event.target.value = ""; 
    });

    // Initial render on page load
    renderTasks();
  </script>
</body>
</html>
